; Presets del router de llama-server.
;
; Cada seccion es un modelo que aparece en el selector de la interfaz web, y las
; claves son las opciones largas de llama-server SIN los dos guiones. El router
; lanza un servidor hijo con esa linea de comandos. El formato se dedujo
; probando, porque el README no lo documenta.
;
; Son todos EL MISMO archivo de modelo con distinto reparto. Estan para buscar el
; punto dulce desde la web sin tocar la linea de comandos: se elige uno, se
; espera a que cargue y se prueba.
;
; ---------------------------------------------------------------------------
; APUNTA A F: (NVMe). El HDD daba 193 MB/s y el NVMe 2.572 MB/s: la carga del
; modelo pasa de ~110 s a ~15 s.
;
; DOS CAMBIOS OBLIGADOS POR LA COMPILACION NUEVA (b11056, antes 10164):
;
;   no-mmap = true  ->  load-mode = none
;     La bandera --no-mmap YA NO EXISTE. Con la compilacion nueva los seis
;     presets fallaban al arrancar. `load-mode = none` es su equivalente exacto.
;
;   La medida de "1,2 tok/s con mmap contra 23,4 sin ella" se tomo DESDE EL HDD.
;     Desde NVMe puede que ya no aplique y mmap salga bien. Sin medir.
;
; AVISO sobre los presets con cache-type-k/v = q8_0: si esta compilacion no
; lleva GGML_CUDA_FA_ALL_QUANTS=ON, combinarlo con flash-attn = on hace que
; llama.cpp caiga EN SILENCIO a atencion por CPU y el prefill se va 25-45x mas
; lento. Nunca se ha medido aqui. Si esos presets van raros, mirar esto primero.
; ---------------------------------------------------------------------------
;
; Las dos constantes que no se tocan, y por que:
;
;   load-mode  Con mmap, los expertos que van a la CPU se quedan MAPEADOS desde
;              el archivo de 16,85 GB en disco en vez de cargarse en RAM. Medido
;              en HDD: 1,2 tok/s con mmap contra 23,4 sin ella.
;   parallel   Por defecto son CUATRO ranuras, cada una con el contexto ENTERO.
;              Con 32k eso reserva 131072 tokens de KV, cuatro veces lo necesario.
;
; La cuenta del KV en este modelo: 40 capas, 2 cabezas KV, clave de 256, o sea
; 80 KB por token en f16 -> 1,3 GB a 16k, 2,7 a 32k, 5,4 a 64k. Los presets "q8"
; cuantizan esa cache a 8 bits y la parten por la mitad, que es lo que permite
; doblar el contexto sin pedir mas VRAM.
;
; n-cpu-moe = cuantas capas de expertos van a la RAM. MENOS es mas rapido pero
; ocupa mas VRAM, asi que a mas contexto hay que subirlo para dejarle sitio a la
; cache KV. Por eso sube en cada preset.
;
; cache-ram = MiB de RAM para la cache de prompts. El defecto de llama-server
; son 8192 y nadie lo pide: medido en el proyecto ojo, eran 2,8 GB residentes y
; 7,3 GB comprometidos de mas. No se pone a 0 porque esa cache es lo que hace
; que repetir un prompt cueste 151 ms en vez de 1.026.

[qwen-8k]
model = F:/ai/models/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
mmproj = F:/ai/models/mmproj-F16.gguf
ctx-size = 8192
n-cpu-moe = 24
n-gpu-layers = 99
flash-attn = on
threads = 6
parallel = 1
load-mode = none
cache-ram = 1024

[qwen-16k]
model = F:/ai/models/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
mmproj = F:/ai/models/mmproj-F16.gguf
ctx-size = 16384
n-cpu-moe = 28
n-gpu-layers = 99
flash-attn = on
threads = 6
parallel = 1
load-mode = none
cache-ram = 1024

[qwen-32k]
model = F:/ai/models/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
mmproj = F:/ai/models/mmproj-F16.gguf
ctx-size = 32768
n-cpu-moe = 32
n-gpu-layers = 99
flash-attn = on
threads = 6
parallel = 1
load-mode = none
cache-ram = 1024

; De aqui en adelante la cache KV va cuantizada a 8 bits: la mitad de VRAM para
; el mismo contexto, a cambio de una perdida de precision que en conversacion
; practicamente no se nota. Ver el AVISO de arriba sobre FA_ALL_QUANTS.
[qwen-64k-q8]
model = F:/ai/models/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
mmproj = F:/ai/models/mmproj-F16.gguf
ctx-size = 65536
n-cpu-moe = 34
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
threads = 6
parallel = 1
load-mode = none
cache-ram = 1024

[qwen-128k-q8]
model = F:/ai/models/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
mmproj = F:/ai/models/mmproj-F16.gguf
ctx-size = 131072
n-cpu-moe = 38
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
threads = 6
parallel = 1
load-mode = none
cache-ram = 1024

; El maximo que declara el propio modelo (context_length = 262144 en el GGUF).
; Cabe solo con la cache KV cuantizada y casi todos los expertos en RAM.
[qwen-262k-q8]
model = F:/ai/models/Qwen3.6-35B-A3B-UD-Q3_K_XL.gguf
mmproj = F:/ai/models/mmproj-F16.gguf
ctx-size = 262144
n-cpu-moe = 40
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
threads = 6
parallel = 1
load-mode = none
cache-ram = 1024

; ===========================================================================
; BONSAI: el que sustituye al 35B en el Win+Space.
;
; Por que, medido en D:\2026-projects\ojo\banco-modelos.ps1:
;
;   discriminacion en documentos largos   3/3, igual que el 35B
;   RAM                                   2,0 GB contra 10,8 del 35B
;   carga                                 4,7 s contra 14,4
;   VRAM                                  cabe ENTERO, sin --n-cpu-moe
;
; Lo que pierde: un hecho de los diez (que rio cruza Lima), y va mas lento con
; documentos largos -- 9,3 s contra 3,4 -- en parte porque tokeniza un 32% mas.
;
; ctx-size 24576 y no 16384: su tokenizador parte el MISMO corpus en 21.132
; fichas donde el 35B usa 15.637. Con 16k se queda corto y el servidor responde
; "exceeds the available context size".
;
; OJO: este preset SOLO funciona con el fork de PrismML
; (F:\ai\llama.cpp-prism). Nuestro llama.cpp normal rechaza PQ2_0, y su ficha
; avisa de que si lo confunde con Q2_0 "produce basura" sin avisar.
[bonsai]
model = F:/ai/models/bonsai-2-27b/Ternary-Bonsai-2-27B-PQ2_0.gguf
mmproj = F:/ai/models/bonsai-2-27b/Ternary-Bonsai-2-27B-mmproj-BF16.gguf
ctx-size = 24576
n-gpu-layers = 99
flash-attn = on
threads = 6
parallel = 1
load-mode = none
cache-ram = 1024

; El modelo de vision de `ojo`: cabe ENTERO en los 12,28 GB, sin reparto a CPU.
; Medido: 1,2 GB de RAM contra 10,5 del 35B, y carga en 5,1 s.
[qwen3-vl-8b]
model = F:/ai/models/qwen3-vl-8b/Qwen3-VL-8B-Instruct-Q8_0.gguf
mmproj = F:/ai/models/qwen3-vl-8b/mmproj-F16.gguf
ctx-size = 8192
n-gpu-layers = 99
flash-attn = on
threads = 6
parallel = 1
load-mode = none
cache-ram = 1024
