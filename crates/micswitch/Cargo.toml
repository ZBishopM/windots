[package]
name = "micswitch"
version = "0.1.0"
edition = "2021"

# Cycles the default capture device via the undocumented IPolicyConfig COM API.
[dependencies]
rice-common = { path = "../rice-common", features = ["settings", "audio"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  # IAudioEndpointVolume, para leer y fijar el nivel de entrada.
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
] }
