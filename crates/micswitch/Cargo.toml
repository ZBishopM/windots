[package]
name = "micswitch"
version = "0.1.0"
edition = "2021"

# Cycles the default capture device via the undocumented IPolicyConfig COM API.
[dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
] }
