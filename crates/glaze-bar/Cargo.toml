[package]
name = "glaze-bar"
version = "0.2.0"
edition = "2021"

# The status bar. Win32 is reached through rice-common::win (raw externs), so the
# `windows` crate is not a dependency here.
[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sysinfo = "0.32"
rice-common = { path = "../rice-common", features = ["ui", "ipc", "event"] }
