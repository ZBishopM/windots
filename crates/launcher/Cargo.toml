[package]
name = "launcher"
version = "0.1.0"
edition = "2021"

# Application launcher: the Win+Space search box. Replaces PowerToys' Command
# Palette, which costs 267 MB resident and 59s of cold start at every login --
# measured, it was the single largest item in this machine's post-boot phase.
[dependencies]
rice-common = { path = "../rice-common", features = ["ui", "settings"] }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
# Helix's matcher: same scoring as fzf, ~6x faster than skim's fuzzy-matcher,
# and unlike either it handles non-ASCII and Unicode graphemes correctly.
#
#
# The matcher only, NOT the `nucleo` picker built on top of it. The picker was
# tried first as the file index's store and matcher: it walked this machine's
# 2,169,925 entries in 131 s using 266 MB, against 19 s and 10 MB for the bare
# walk -- roughly 118 bytes of bookkeeping per entry. files.rs stores entries
# itself (12 bytes plus the name) and fans the matching out by hand.
nucleo-matcher = "0.3"

# Misma version que usa eframe 0.29: es como se obtiene el HWND real en vez de
# adivinarlo. Dos intentos de encontrarlo a mano (por titulo y recorriendo las
# ventanas del proceso) fallaron en silencio y cada uno acabo en un bucle.
raw-window-handle = "0.6"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
