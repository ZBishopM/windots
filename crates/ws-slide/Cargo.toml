[package]
name = "ws-slide"
version = "0.1.0"
edition = "2021"

# Workspace-switch slide animation: GlazeWM IPC + a GDI layered overlay + a
# low-level keyboard hook.
[dependencies]
tungstenite = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
