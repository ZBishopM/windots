[package]
name = "sysaudio-loopback"
version = "0.1.0"
edition = "2021"

# WASAPI capture (loopback or microphone) -> s16le on stdout.
[dependencies]
# `audioshare` es Win32 a pelo y no pide feature; `settings` si, y hace falta
# para leer record_mic de rice.json.
rice-common = { path = "../rice-common", features = ["settings"] }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  # Solo para leer el nombre legible del endpoint en el log (endpoint_name):
  # PKEY_Device_FriendlyName vive en FunctionDiscovery, el PROPVARIANT que lo
  # devuelve en StructuredStorage, y OpenPropertyStore en PropertiesSystem.
  "Win32_Devices_FunctionDiscovery",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_PropertiesSystem",
] }
