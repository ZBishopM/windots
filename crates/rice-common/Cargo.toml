[package]
name = "rice-common"
version = "0.1.0"
edition = "2021"

# Shared pieces of the rice's Rust tools. Everything is feature-gated so a
# consumer only compiles what it asks for: micswitch wants `win` and nothing
# else, the toast wants `ui`, ws-slide wants `ipc`.
#
# The `win` module deliberately uses raw `extern "system"` declarations instead
# of the `windows` crate, so pulling in these helpers never drags a Win32
# metadata crate into a binary that doesn't otherwise need one.
[features]
default = []
ui = ["dep:eframe"]                       # egui palette + font + icon drawing
ipc = ["dep:tungstenite", "dep:serde", "dep:serde_json"]
event = ["dep:serde", "dep:serde_json"]   # island.json notification payload
settings = ["dep:serde", "dep:serde_json"] # ~/.config/rice.json
audio = ["dep:windows"]                    # per-app + master volume (Core Audio)
bluetooth = ["dep:windows", "audio"]        # connect/disconnect BT audio devices
media = ["dep:windows"]                    # what is playing + transport controls (SMTC)
spectrum = ["dep:rustfft"]                 # tiny live FFT for the island visualiser
# Bateria de los auriculares. Dos caminos que no se parecen en nada: HID contra
# el dongle del HyperX (de ahi hidapi) y anuncios BLE para los AirPods (de ahi
# la feature Advertisement). Windows no publica ninguna de las dos.
battery = ["dep:hidapi", "dep:windows", "audio", "bluetooth"]

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"], optional = true }
tungstenite = { version = "0.24", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rustfft = { version = "6", optional = true }
hidapi = { version = "2", optional = true }
windows = { version = "0.58", optional = true, features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  # CreateMutexW vive detras de Win32_Security; sin declararlo aqui, esto solo
  # compilaba porque otro crate del arbol lo activaba por unificacion.
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Com_StructuredStorage",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_Shell_PropertiesSystem",
  "Media_Control",
  "Storage_Streams",
  "Devices_Enumeration",
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Foundation_Collections",
  "Foundation",
] }

# Las sondas de examples/ usan modulos que estan tras una feature, y un
# ejemplo sin `required-features` se compila SIEMPRE. El resultado era que
# `cargo test -p rice-common` -- el comando obvio -- ni siquiera compilaba:
# fallaba en los ejemplos, no en el codigo. Declararlas hace que Cargo las
# salte cuando su feature no esta puesta.
[[example]]
name = "airpods-listen-only"
required-features = ["audio"]

[[example]]
name = "audio-probe"
required-features = ["audio", "bluetooth"]

[[example]]
name = "out_name"
required-features = ["audio"]

[[example]]
name = "volume_probe"
required-features = ["audio"]

[[example]]
name = "media_probe"
required-features = ["media"]

[[example]]
name = "spectrum_probe"
required-features = ["spectrum"]
